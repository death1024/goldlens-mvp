name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Core tests
        run: pnpm --filter @goldlens/core test

      - name: Web unit tests
        run: pnpm --filter @goldlens/web test

      - name: Next.js build
        run: pnpm --filter @goldlens/web build

      - name: Legacy static demo smoke test
        run: node tests/smoke.mjs
